{{ define "create_form" }}
<div class="modal-overlay">
    <div class="modal-box">
        <h2>Add Fuel Log</h2>
        <form hx-post="/web/fuel-logs" hx-target="#fuel-table" hx-swap="innerHTML">
            <label>Date</label>
            <input type="date" name="date" required>

            <label>Price per Liter</label>
            <input type="number" step="0.01" name="price_per_liter" required>

            <label>Total Paid</label>
            <input type="number" step="0.01" name="total_paid" required>

            <label>Liters Filled</label>
            <input type="number" step="0.01" name="liters_filled" required>

            <label>KM Start</label>
            <input type="number" name="km_start" required>

            <label>KM End</label>
            <input type="number" name="km_end" required>

            <label>Location</label>
            <input type="text" name="location">

            <label>Notes</label>
            <input type="text" name="notes">

            <div class="modal-actions">
                <button type="submit">Save</button>
                <button type="button" hx-get="/web/fuel-logs/close-modal" hx-target="#modal-container" hx-swap="innerHTML">Cancel</button>
            </div>
        </form>
    </div>
</div>
{{ end }}
