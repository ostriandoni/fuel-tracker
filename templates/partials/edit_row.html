{{ define "edit_row" }}
<tr id="row-{{ .ID }}">
    <td><input type="date" name="date" value="{{ .Date.Format "2006-01-02" }}"></td>
    <td>{{ .LocationName }}</td>
    <td>{{ .PetrolTypeName }}</td>
    <td><input type="number" step="0.01" name="price_per_liter" value="{{ .PricePerLiter }}"></td>
    <td><input type="number" step="0.01" name="total_paid" value="{{ .TotalPaid }}"></td>
    <td><input type="number" step="0.01" name="liters_filled" value="{{ .LitersFilled }}"></td>
    <td><input type="number" name="km_start" value="{{ .KmStart }}"></td>
    <td><input type="number" name="km_end" value="{{ .KmEnd }}"></td>
    <td colspan="3">-</td>
    <td><input type="text" name="notes" value="{{ .Notes }}"></td>
    <td>
        <button hx-put="/web/fuel-logs/{{ .ID }}" hx-include="closest tr" hx-target="#row-{{ .ID }}" hx-swap="outerHTML">Save</button>
        <button hx-get="/web/fuel-logs/{{ .ID }}" hx-target="#row-{{ .ID }}" hx-swap="outerHTML">Cancel</button>
    </td>
</tr>
{{ end }}
