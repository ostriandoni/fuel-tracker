{{ define "row" }}
<tr id="row-{{ .ID }}">
    <td>{{ .Date.Format "2006-01-02" }}</td>
    <td>{{ .LocationName }}</td>
    <td>{{ .PetrolTypeName }}</td>
    <td>{{ .PricePerLiter }}</td>
    <td>{{ .TotalPaid }}</td>
    <td>{{ .LitersFilled }}</td>
    <td>{{ .KmStart }}</td>
    <td>{{ .KmEnd }}</td>
    <td>{{ .Distance }}</td>
    <td>{{ .PaidPerKm.StringFixed 2 }}</td>
    <td>{{ .UsageKmL.StringFixed 2 }}</td>
    <td>{{ .Notes }}</td>
    <td>
        <button hx-get="/web/fuel-logs/{{ .ID }}/edit" hx-target="#row-{{ .ID }}" hx-swap="outerHTML">Edit</button>
        <button hx-delete="/web/fuel-logs/{{ .ID }}" hx-target="#row-{{ .ID }}" hx-swap="outerHTML swap:1s" hx-confirm="Delete this record?">Delete</button>
    </td>
</tr>
{{ end }}
